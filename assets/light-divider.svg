<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="A blue crystal-light divider"><title>A blue crystal-light divider</title><defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#0b1729"/><stop offset=".5" stop-color="#07111f"/><stop offset="1" stop-color="#102845"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#e5effe"/><stop offset=".52" stop-color="#afc7e3"/><stop offset="1" stop-color="#e2f1ff"/></linearGradient>
 <linearGradient id="blade"><stop stop-color="#3661a0" stop-opacity="0"/><stop offset=".27" stop-color="#6cb5ff"/><stop offset=".55" stop-color="#e3f7ff"/><stop offset=".78" stop-color="#7bc6ff"/><stop offset="1" stop-color="#3b6da9" stop-opacity="0"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#3986f0" stop-opacity=".28"/><stop offset="1" stop-color="#2469aa" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#76b5fc" stroke-opacity=".08" stroke-width="1"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
 </defs>
 <style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
 <path d="M0 20H1200" stroke="url(#blade)" stroke-width="1.4"/>
 <path d="M567 20L594 8L631 20L605 32Z" fill="#0c203a" stroke="#8ad0ff" stroke-opacity=".75"/>
 <path d="M589 20L602 13L615 20L602 27Z" fill="#b1e3ff" fill-opacity=".7"/>
 <path d="M1098 20L1120 12L1113 26ZM85 17L99 10L107 25Z" fill="#80c7ff" fill-opacity=".26"/>
 <g class="motion"><ellipse cx="601" cy="20" rx="67" ry="6" fill="#77bfff" opacity=".2" filter="url(#glow)"><animate attributeName="opacity" values=".12;.6;.12" dur="4.8s" repeatCount="indefinite"/></ellipse>
 <path d="M140 20H205" stroke="#e5f9ff" stroke-width="2" opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;860 0" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;.8;0" dur="6.5s" repeatCount="indefinite"/></path></g></svg>